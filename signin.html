<!-- signin.html -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — CodeMates</title>
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<style>
.main-container {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 2rem 1rem;
}
.auth-card {
width: 100%;
max-width: 420px;
background-color: var(--card);
border: 1px solid var(--border);
border-radius: 10px;
padding: 1.75rem 1.5rem;
}
@media (min-width: 480px) {
.auth-card { padding: 2.25rem 2rem; }
}
.auth-title {
font-family: 'Manrope', sans-serif;
font-weight: 800;
font-size: 1.5rem;
letter-spacing: -0.02em;
margin-bottom: 0.375rem;
margin-top: 0.875rem;
color: var(--text);
}
.auth-subtitle {
font-size: 0.875rem;
color: var(--muted);
margin-bottom: 1.5rem;
}
.form-group { margin-bottom: 1.125rem; }
label {
display: block;
font-family: 'JetBrains Mono', monospace;
font-size: 0.75rem;
font-weight: 500;
color: var(--text);
margin-bottom: 0.45rem;
text-transform: uppercase;
letter-spacing: 0.03em;
}
input {
width: 100%;
background-color: var(--bg);
color: var(--text);
border: 1px solid var(--border);
border-radius: 8px;
padding: 0.675rem 0.875rem;
font-family: 'Inter', sans-serif;
font-size: 0.9375rem;
outline: none;
transition: border-color 0.15s ease;
}
input::placeholder { color: var(--muted); opacity: 0.7; }
input:focus { border-color: var(--accent); }
.btn-submit {
width: 100%;
margin-top: 0.5rem;
background-color: var(--accent);
color: #FFFFFF;
font-family: 'Inter', sans-serif;
font-size: 0.9375rem;
font-weight: 600;
border: none;
border-radius: 8px;
padding: 0.75rem 1rem;
cursor: pointer;
transition: opacity 0.15s ease;
}
.btn-submit:hover { opacity: 0.92; }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.status-box {
display: none;
border-radius: 8px;
padding: 0.75rem 0.875rem;
font-size: 0.85rem;
margin-bottom: 1.25rem;
border: 1px solid transparent;
}
.status-box.error {
display: block;
background-color: rgba(239, 68, 68, 0.1);
border-color: rgba(239, 68, 68, 0.3);
color: #F87171;
}
.status-box.success {
display: block;
background-color: rgba(16, 185, 129, 0.1);
border-color: rgba(16, 185, 129, 0.3);
color: #34D399;
}
.auth-footer {
margin-top: 1.5rem;
padding-top: 1.25rem;
border-top: 1px solid var(--border);
text-align: center;
font-size: 0.875rem;
color: var(--muted);
}
.auth-footer a { color: var(--accent); font-weight: 500; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header class="navbar">
<div class="nav-container">
<a href="index.html" class="brand">Code<span>Mates</span></a>
<nav class="nav-menu" id="navMenu" aria-label="Main Navigation">
<ul class="nav-links">
<li><a href="index.html" class="nav-item-link">Home</a></li>
<li><a href="notes.html" class="nav-item-link">Notes</a></li>
<li><a href="pyqs.html" class="nav-item-link">PYQs</a></li>
<li><a href="jobs.html" class="nav-item-link">Jobs</a></li>
<li><a href="trending.html" class="nav-item-link">Trending</a></li>
<li><a href="projects.html" class="nav-item-link">Projects</a></li>
<li><a href="members.html" class="nav-item-link">Members</a></li>
<li><a href="events.html" class="nav-item-link">Events</a></li>
<li><a href="join.html" class="nav-item-link">Join Us</a></li>
</ul>
</nav>
<div class="nav-right">
<div id="authNav">
<a href="signin.html" class="nav-link">Sign In</a>
<a href="signup.html" class="nav-btn-primary">Sign Up</a>
</div>
<button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
<span id="themeLabel">LIGHT</span>
</button>
<button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">MENU</button>
</div>
</div>
</header>

<main class="main-container">
<section class="auth-card">
<span class="badge">// WELCOME BACK</span>
<h1 class="auth-title">Sign in to CodeMates</h1>
<p class="auth-subtitle">Access study notes, PYQs, peer projects, and community events.</p>
<div id="statusBox" class="status-box" role="alert"></div>
<form id="signinForm" novalidate>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
</div>
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
</div>
<button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
</form>
<div class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></div>
</section>
</main>

<script src="js/auth-nav.js"></script>
<script>
var signinForm = document.getElementById('signinForm');
var submitBtn = document.getElementById('submitBtn');
var statusBox = document.getElementById('statusBox');

function showStatus(message, type) {
statusBox.textContent = message;
statusBox.className = 'status-box ' + type;
}

signinForm.addEventListener('submit', async function (e) {
e.preventDefault();
statusBox.className = 'status-box';
statusBox.textContent = '';

var email = document.getElementById('email').value.trim();
var password = document.getElementById('password').value;

if (!email || !password) {
showStatus('Please enter both your email and password.', 'error');
return;
}

submitBtn.disabled = true;
submitBtn.textContent = 'Signing in...';

try {
var result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
if (result.error) { throw result.error; }

showStatus('Signed in! Redirecting to home...', 'success');
setTimeout(function () { window.location.href = 'index.html'; }, 400);
} catch (err) {
showStatus((err && err.message) || 'Invalid login credentials. Please try again.', 'error');
submitBtn.disabled = false;
submitBtn.textContent = 'Sign In';
}
});
</script>
</body>
</html>
